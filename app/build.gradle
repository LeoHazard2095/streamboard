plugins {
    id 'com.android.application'
}
android {
    namespace 'com.techboard.streamboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.techboard.streamboard'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        ownerRelease {
            def keyFile = System.getenv('STREAMBOARD_KEYSTORE_PATH')
            if (keyFile && System.getenv('STREAMBOARD_STORE_PASSWORD') &&
                    System.getenv('STREAMBOARD_KEY_ALIAS') && System.getenv('STREAMBOARD_KEY_PASSWORD')) {
                storeFile file(keyFile)
                storePassword System.getenv('STREAMBOARD_STORE_PASSWORD')
                keyAlias System.getenv('STREAMBOARD_KEY_ALIAS')
                keyPassword System.getenv('STREAMBOARD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ownerRelease
        }
    }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
}
