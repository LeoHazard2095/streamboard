name: Build StreamBoard Windows Desktop (Clean Workspace v1.5.0)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Run desktop, playlist analyzer, HLS bridge and parser tests
        working-directory: desktop
        run: npm test
      - name: Verify desktop modules before packaging
        working-directory: desktop
        run: npm run prepare-player && npm run verify:source
      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: StreamBoard-v1.5.0-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
